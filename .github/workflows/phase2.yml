name: Phase 2 display topology and parity

on:
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/e2e/**"
      - "wdio.conf.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/phase2.yml"
      - "docs/support-matrix.md"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/e2e/**"
      - "wdio.conf.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/phase2.yml"
      - "docs/support-matrix.md"

permissions:
  contents: read

env:
  NODE_VERSION: "24.x"
  PNPM_VERSION: "11.19.0"

jobs:
  macos-13:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm build
      - run: pnpm exec tauri build --debug
      - run: pnpm exec wdio run wdio.conf.ts --suite phase2-matrix

  windows-2022:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: pnpm build
      - run: pnpm exec tauri build --debug
      - run: pnpm exec wdio run wdio.conf.ts --suite phase2-matrix
